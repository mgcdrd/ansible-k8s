---

# k8s_version, k8s_calico_version, network CIDRs, k8s_init_master,
# k8s_control_plane_endpoint, k8s_keepalived_enabled, k8s_init_token,
# k8s_cluster_group, and the OIDC vars all moved to
# inventory-common/group_vars/k8s.yml — shared with deployments/k8s-platform,
# see that repo's README for the tier rule.

# lvm_volumes is passed directly to mgcdrd.infrabase.lvm2.
# The /var entry is required for k8s nodes. Add further entries to extend
# additional LVs on all nodes, or override per host/group in their own
# group_vars file.
#
# See the lvm2 role README for the full list of supported keys.
lvm_volumes:
  - lv:       lv_var
    size:      256G
    resizefs:  true
    mount:     /var
  # - lv:     lv_data
  #   size:   500G
  #   resizefs: true
  #   mount:  /data
