---

# ---- Kubernetes version ----
k8s_version: "1.32"
k8s_calico_version: "3.31.0"

# ---- Network CIDRs ----
k8s_svc_cidr: "10.96.0.0/12"
k8s_pod_cidr: "10.112.0.0/12"

# ---- Cluster identity ----
# FQDN of the node that runs kubeadm init (first master)
k8s_init_master: kube1.example.com

# DNS name for the control plane endpoint.
# HA (multi-master): set to the keepalived VIP DNS name.
# Single-master:     set to the same value as k8s_init_master.
# Real cluster is single-master (kube1 only) — kube-api.example.com
# must be a DNS record pointing at kube1; update it there if kube1 changes,
# rather than re-running kubeadm init (this endpoint is baked into cert SANs).
k8s_control_plane_endpoint: kube-api.example.com

# Set to false for a single-master cluster — skips keepalived install/config.
# When false, k8s_control_plane_endpoint should equal k8s_init_master.
k8s_keepalived_enabled: false

# Bootstrap token — generate with:
# printf '%s.%s\n' $(tr -dc a-z0-9 </dev/urandom | head -c 6) $(tr -dc a-f0-9 </dev/urandom | head -c 16)
#k8s_init_token: "CHANGEME"

# ---- Cluster group ----
# Inventory group that gets written to /etc/hosts on every node.
k8s_cluster_group: k8s

# ---- OIDC authentication ----
# Point at your Keycloak VIP — must be resolvable from the API server nodes.
# keycloak_hostname and keycloak_lab_realm_name come from the Keycloak deployment.
k8s_oidc_enabled:    true
k8s_oidc_issuer_url: "https://infra-kc.example.com/realms/lab"
k8s_oidc_client_id:  "kubernetes"

# ---- Storage ----
# lvm_volumes is passed directly to mgcdrd.infrabase.lvm2.
# The /var entry is required for k8s nodes. Add further entries to extend
# additional LVs on all nodes, or override per host/group in their own
# group_vars file.
#
# See the lvm2 role README for the full list of supported keys.
lvm_volumes:
  - lv:       lv_var
    size:      256G
    resizefs:  true
    mount:     /var
  # - lv:     lv_data
  #   size:   500G
  #   resizefs: true
  #   mount:  /data
