---

# ============================================================
# Phase 0 — Instance guard
# Fails unless exactly one k8s instance is loaded (set
# DEPLOY_INSTANCE=<name>, see ansible.cfg). Tagged always so
# --tags runs still get checked.
# ============================================================
- name: K8s - Instance guard
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [always]
  roles:
    - role: mgcdrd.infrabase.instance_guard
      vars:
        instance_guard_group: k8s


# ============================================================
# Phase 1 — Node preparation (runs by default)
# Removes swap, configures kernel, installs k8s packages.
# Must run before LVM extension so swap space is freed first.
#
# Usage: ansible-playbook site.yml
#        ansible-playbook site.yml --tags config
# ============================================================
- name: K8s - Node preparation
  hosts: k8s
  become: true
  tags: [config]
  vars:
    k8s_run: config
  roles:
    - mgcdrd.infrasvc.k8s


# ============================================================
# Phase 1b — Extend /var filesystem (runs by default)
# Separate play so gather_facts picks up freed swap space
# from the previous play before the LVM preflight checks.
#
# Usage: ansible-playbook site.yml
#        ansible-playbook site.yml --tags config
# ============================================================
- name: K8s - Extend LVM volumes
  hosts: k8s
  become: true
  tags: [config]
  roles:
    - mgcdrd.infrabase.lvm2


# ============================================================
# Phase 1c — Keepalived on masters (runs by default)
# Floats the k8s-api VIP across control plane nodes.
# Skipped when k8s_keepalived_enabled: false (single-master).
#
# Usage: ansible-playbook site.yml
#        ansible-playbook site.yml --tags config
# ============================================================
- name: K8s - Keepalived on masters
  hosts: k8smasters
  become: true
  tags: [config]
  roles:
    - role: mgcdrd.infrasvc.keepalived
      when: k8s_keepalived_enabled | bool


# ============================================================
# Phase 2 — Cluster initialization (must be run explicitly)
# Initializes the cluster on k8s_init_master, then joins
# all remaining masters and workers.
#
# Usage: ansible-playbook site.yml --tags init
# ============================================================
- name: K8s - Cluster initialization
  hosts: k8s
  become: true
  tags: [init, never]
  vars:
    k8s_run: init
  roles:
    - mgcdrd.infrasvc.k8s


# ============================================================
# Phase 3 — Add nodes (must be run explicitly)
# Joins new nodes to an already-running cluster.
#
# Usage: ansible-playbook site.yml --tags addnodes
# ============================================================
- name: K8s - Add nodes
  hosts: k8s
  become: true
  tags: [addnodes, never]
  vars:
    k8s_run: addnodes
  roles:
    - mgcdrd.infrasvc.k8s
