[defaults]
inventory          = inventory/,../../inventory-common/hosts.yml,../../inventory-common/instances/k8s/${DEPLOY_INSTANCE}
collections_path   = ./collections
host_key_checking  = false
gathering          = smart
fact_caching       = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout    = 3600

[ssh_connection]
pipelining = true
